name: Atualizar atividade do perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Atualizar card com o GitHub GraphQL
        run: node scripts/update-activity-stats.mjs
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Salvar atualização no repositório
        run: |
          if git diff --quiet -- assets/activity-stats.svg; then
            echo "O card já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-stats.svg
          git commit -m "chore: atualizar estatísticas do perfil"
          git push
